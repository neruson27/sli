[package]
name = "sli"
version = "0.1.0"
edition = "2021"
description = "Desktop companion pet for Antigravity CLI"
authors = ["neruson27"]
license = "MIT"

[lib]
name = "sli_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.8"
