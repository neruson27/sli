<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rimuruGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Rimuru Slime Body -->
  <path d="M 128 48 
           C 176 48, 208 76, 218 116 
           C 228 156, 230 190, 204 214 
           C 178 230, 78 230, 52 214 
           C 26 190, 28 156, 38 116 
           C 48 76, 80 48, 128 48 Z" 
        fill="url(#rimuruGradient)" />

  <!-- Specular Liquid Highlight -->
  <ellipse cx="96" cy="80" rx="36" ry="16" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="72" cy="98" rx="10" ry="10" fill="#ffffff" opacity="0.6"/>

  <!-- Blush Cheeks -->
  <ellipse cx="64" cy="162" rx="18" ry="10" fill="#f472b6" opacity="0.75"/>
  <ellipse cx="192" cy="162" rx="18" ry="10" fill="#f472b6" opacity="0.75"/>

  <!-- Rimuru Signature Angled Slit Eyes: \  / -->
  <!-- Left Eye -->
  <path d="M 78 126 L 112 154" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 88 112 L 104 125" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>

  <!-- Right Eye -->
  <path d="M 178 126 L 144 154" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 168 112 L 152 125" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>

  <!-- Cute Smile -->
  <path d="M 118 174 Q 128 184 138 174" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
