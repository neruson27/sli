<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="rimuruBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#def4ff"/>
      <stop offset="35%" stop-color="#9bd9ff"/>
      <stop offset="75%" stop-color="#6ebdff"/>
      <stop offset="100%" stop-color="#46a0f4"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <ellipse cx="128" cy="136" rx="98" ry="86" fill="#60a5fa" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Rimuru Slime Body -->
  <path d="M 128 42 
           C 188 42, 230 84, 230 138 
           C 230 192, 186 216, 128 216 
           C 70 216, 26 192, 26 138 
           C 26 84, 68 42, 128 42 Z" 
        fill="url(#rimuruBody)" 
        stroke="#2563eb" 
        stroke-width="5" 
        stroke-linejoin="round"/>

  <!-- Specular Crescent Liquid Shine -->
  <path d="M 72 74 
           C 96 54, 150 54, 184 74 
           C 156 66, 100 66, 72 74 Z" 
        fill="#ffffff" 
        opacity="0.8"/>
  <circle cx="66" cy="94" r="5" fill="#ffffff" opacity="0.7"/>

  <!-- Blush Cheeks -->
  <ellipse cx="76" cy="154" rx="14" ry="7" fill="#f472b6" opacity="0.6"/>
  <ellipse cx="180" cy="154" rx="14" ry="7" fill="#f472b6" opacity="0.6"/>

  <!-- Rimuru Slit Eyes: \  / -->
  <!-- Left Eye -->
  <path d="M 88 132 L 114 150" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Left Accent Ticks -->
  <path d="M 98 123 L 108 131" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Eye -->
  <path d="M 168 132 L 142 150" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Right Accent Ticks -->
  <path d="M 158 123 L 148 131" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
</svg>
